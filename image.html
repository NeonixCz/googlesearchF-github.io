<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Image Search</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top-nav">
      <nav aria-label="Main navigation">
        <a href="index.html">Google Search</a>
      </nav>
    </header>

    <main class="home">
      <h1 class="wordmark" aria-label="Google">
        <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
        <span class="image-label">Images</span>
      </h1>
      <form class="search-form" action="https://www.google.com/search" method="get">
        <label class="visually-hidden" for="image-query">Search Google Images</label>
        <input class="search-box" id="image-query" type="search" name="q" autocomplete="off" />
        <input type="hidden" name="tbm" value="isch" />
        <div class="button-row">
          <button class="search-button" type="submit">Google Search</button>
        </div>
      </form>
    </main>
  </body>
</html>
